- name: creating instances
  hosts: all
  connection: local
  vars:
    sg_id: sg-06ce163ff833036b8
    ami_id: ami-0220d79f3f480ecf5
    env: dev
    domain_name: sowjanya.fun
    action: create
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: creation of instances
    amazon.aws.ec2_instance:
     instance_type: "t3.micro"
     security_group: "{{ sg_id }}"
     image_id: "{{ ami_id }}"
     name: "{{ item }}-{{ env }}"
     tags:
      project: roboshop
      Environment: "{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"
     
  - name: print ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"  
    when: action == "create"

  - name: creating r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
      type: A
      ttl: 1 
      value: "{{ item.instances[0].private_ip_address }}"
      wait: false
    loop: "{{ ec2_output.results }}" # list
    when: action == "create"
  
  - name: creating r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
      type: A
      ttl: 1 
      value: "{{ item.instances[0].public_ip_address }}"
      wait: false
    loop: "{{ ec2_output.results }}" # list
    when: 
    - action == "create" 
    - item.item == "frontend"

    - name: deleting r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
      type: A
      ttl: 1 
      wait: false # list
    when: action == "delete"   
